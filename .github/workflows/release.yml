name: Release

# Builds the native macOS app for a Release Please tag and attaches a zip + DMG.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Native macOS app
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build macOS app (ad-hoc signed)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-macos.sh

      - name: Package DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-dmg.sh

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            dist/*-macOS-*.zip dist/*.dmg \
            --clobber --repo "${{ github.repository }}"
