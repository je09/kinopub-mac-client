version: 2
updates:
  # Keep GitHub Actions pinned to current major versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]

  # Dependabot does not inspect local packages transitively from an Xcode project, so each package
  # directory is listed explicitly. Xcode-project package references are monitored manually.
  - package-ecosystem: "swift"
    directories:
      - "/Packages/KinoPubBackend"
      - "/Packages/KinoPubKit"
      - "/Packages/KinoPubLogging"
      - "/Packages/KinoPubUI"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
